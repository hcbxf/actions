
name: Build OpenWrt CI
on:
  workflow_dispatch:
    inputs:
      REPO_URL:
        description: "Select Sources Repo "
        required: false
        default: "https://github.com/hanwckf/immortalwrt-mt798x"
        type: choice
        options:
          - https://github.com/hanwckf/immortalwrt-mt798x
          - https://github.com/immortalwrt/immortalwrt
          - https://github.com/openwrt/openwrt/
          - https://github.com/LiBwrt-op/openwrt-6.x
          - https://github.com/King-Of-Knights/openwrt-6.x
      REPO_BRANCH:
        description: "Select Repo Branch"
        required: false
        default: "master"
        type: choice
        options:
          - master
          - main
          - v22.03.5
          - v22.03.6
          - v22.03.7
          - v23.05.2
          - v23.05.3
          - openwrt-21.02
          - openwrt-22.03
          - openwrt-23.05
      Config_File:
        description: "Select Config File"
        required: false
        default: ".config.mt7981.immortalwrt-mt798x"
        type: choice
        options:
          - .config.mt7981.immortalwrt-mt798x
          - .config.mt7981.openwrt.luci-app-mtk
          - .config.mt7981.immortalwrt
          - .config.mt7981.openwrt
          - .config.mt7621.openwrt
          - .config.mt7981.immortalwrt-mt798x.nowifi
          - .config.mt7981.immortalwrt-mt798x.printer
          - .config.ipq6000.6.x.openwrt.nowifi
          - .config.mt7981.mesh.immortalwrt
          - .config.mt7621.23.openwrt
      Configuration:
        description: "configuration openwrt"
        required: false
        default: false
        type: boolean
      AC_CONTROLLER_PUBKEY:
        description: "AC-AGENT 公钥（可留空）"
        required: false
        default: ""
        type: string
          
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

    - name: Checkout - clone repository
      uses: actions/checkout@main

    - name: Install - system build dependencies
      run: |
        sudo rm -rf /swapfile /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc || echo "clean partly"
        sudo -E apt-get -qq update
        sudo -E apt-get -yqq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
              bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
              g++-multilib git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
              libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5 libncursesw5-dev libreadline-dev \
              libssl-dev libtool lld lldb lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python2.7 \
              python3 python3-pip python3-ply qemu-utils re2c rsync scons squashfs-tools subversion swig \
              texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -yqq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Download - openwrt source download
      run: |
        if [ "${{ inputs.REPO_URL }}" = "https://github.com/hanwckf/immortalwrt-mt798x" ]; then
            git clone  ${{ inputs.REPO_URL }}  openwrt 
        else
            git clone  ${{ inputs.REPO_URL }} -b ${{ inputs.REPO_BRANCH }} openwrt 
        fi
        
    - name: Update - openwrt source update and install 
      working-directory: openwrt
      run: |
        ./scripts/feeds update -a

        # ac-agent's go.mod declares "go 1.26", so it needs a Go >= 1.21 to
        # either compile it or fetch that toolchain via GOTOOLCHAIN=auto.
        # Releases up to 22.03 ship Go 1.19, which cannot even parse the
        # three-part go directive, so for those swap in a prebuilt official
        # Go 1.26 host toolchain (see .github/openwrt/golang-prebuilt).
        GO_VERSION_MM="$(sed -n 's/^GO_VERSION_MAJOR_MINOR:=//p' \
          feeds/packages/lang/golang/golang/Makefile 2>/dev/null | head -n1 | tr -d '[:space:]')"
        AC_AGENT_CFG=0
        if grep -q '^CONFIG_PACKAGE_ac-agent=y' "../${{ inputs.Config_File }}"; then
          AC_AGENT_CFG=1
        fi
        GO_MODERN=0
        if [ -n "$GO_VERSION_MM" ] \
          && [ "$(printf '%s\n%s\n' 1.21 "$GO_VERSION_MM" | sort -V | head -n1)" = "1.21" ]; then
          GO_MODERN=1
        fi

        if [ "$AC_AGENT_CFG" = 1 ]; then
          # ac-agent is not in the official feeds, pull it from its own feed root.
          git clone --depth 1 https://github.com/naoki66/OpenWrt_AC-Controller.git /tmp/openwrt-ac-controller
          # Follow LuCI's language and use Chinese for missing translations.
          python3 ../.github/openwrt/ac-agent/luci-language.py \
            /tmp/openwrt-ac-controller/agent/openwrt/luci-app-ac-agent
          echo "src-link ac_agent /tmp/openwrt-ac-controller/agent/openwrt" >> feeds.conf.default
          if [ "$GO_MODERN" = 1 ]; then
            # Re-enable Go toolchain switching for this package so the build
            # downloads the required toolchain instead of aborting on go.mod.
            sed -i '/golang-package\.mk[[:space:]]*$/a GO_PKG_BUILD_VARS += GOTOOLCHAIN=auto' \
              /tmp/openwrt-ac-controller/agent/openwrt/ac-agent/Makefile
          fi
          # ac-agent is pure Go; avoid CGO assembler failures on MIPS.
          cp ../.github/openwrt/ac-agent/mips-compat.mk \
            /tmp/openwrt-ac-controller/agent/openwrt/ac-agent/mips-compat.mk
          sed -i '/golang-package\.mk[[:space:]]*$/a include $(CURDIR)/mips-compat.mk' \
            /tmp/openwrt-ac-controller/agent/openwrt/ac-agent/Makefile
          ./scripts/feeds update ac_agent
        fi

        ./scripts/feeds install -a

        if [ "$AC_AGENT_CFG" = 1 ] && [ "$GO_MODERN" = 0 ]; then
          # Replace the feed's Go 1.19 with the official prebuilt Go 1.26 so
          # ac-agent's PKG_BUILD_DEPENDS:=golang/host gets a usable toolchain.
          rm -rf package/feeds/packages/golang
          mkdir -p package/golang
          cp ../.github/openwrt/golang-prebuilt/Makefile package/golang/Makefile
          echo "::notice::branch ${{ inputs.REPO_BRANCH }} ships Go ${GO_VERSION_MM:-unknown}; using the prebuilt Go 1.26 host toolchain for ac-agent."
        fi
        
    - name: Config - openwrt build config
      run: |
        cp ${{ inputs.Config_File }} openwrt/.config
        cd openwrt
        make defconfig
      
    - name: Download - openwrt build dependencies
      working-directory: openwrt
      run: |
        make download -j$(nproc)

    - name: Configurate - configurate openwrt
      if: ${{ inputs.Configuration }}
      run: |
        bash configurate.sh
        
    - name: Build - make openwrt 
      working-directory: openwrt
      env:
        AC_CONTROLLER_PUBKEY: ${{ inputs.AC_CONTROLLER_PUBKEY }}
      run: |
        make defconfig
        make -j$(nproc) AC_CONTROLLER_PUBKEY="$AC_CONTROLLER_PUBKEY" \
          || make -j1 V=s AC_CONTROLLER_PUBKEY="$AC_CONTROLLER_PUBKEY"
        
    - name: Annotations - show annotations
      run: |
        echo "::notice::Repo: ${{ inputs.REPO_URL }}  Branch: ${{ inputs.REPO_BRANCH }}  config: ${{ inputs.Config_File }}"
    
    - name: Upload - push to artifact file
      uses: actions/upload-artifact@main
      with:
        name: openwrt
        path: |
           openwrt/bin/targets/**/*.bin
           openwrt/bin/targets/**/*sysupgrade.*
           openwrt/bin/targets/**/*factory*
           openwrt/bin/targets/**/sha256sums
           openwrt/bin/targets/**/profiles.json
    
